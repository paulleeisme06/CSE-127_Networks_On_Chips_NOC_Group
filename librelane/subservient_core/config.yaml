# Clock
CLOCK_PORT: i_clk
CLOCK_PERIOD: 40  # 25 MHz

# Power
VDD_NETS: [VDD]
GND_NETS: [VSS]

# Synthesis
SYNTH_STRATEGY: AREA 0
MAX_FANOUT_CONSTRAINT: 12

# Die sized for ~2500 standard cells at 45% density
FP_SIZING: absolute
DIE_AREA: [0, 0, 500, 400]
CORE_AREA: [10, 10, 490, 390]

# Placement
PL_TARGET_DENSITY_PCT: 45
GRT_ALLOW_CONGESTION: true
DRT_ANTENNA_REPAIR_ITERS: 5

RUN_POST_GPL_DESIGN_REPAIR: false
RUN_POST_CTS_RESIZER_TIMING: false
GRT_RESIZER_TIMING_OPTIMIZATIONS: false

# PDN
PDN_VWIDTH: 3
PDN_HWIDTH: 3
PDN_VPITCH: 50
PDN_HPITCH: 50
PDN_CORE_RING: false

ERROR_ON_MAGIC_DRC: false
