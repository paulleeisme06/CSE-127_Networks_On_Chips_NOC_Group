# =============================================================================
# librelane/mesh_tile/config.yaml
# Hardens a single mesh_tile as a standalone macro
# Run with: make librelane-tile
# =============================================================================

meta:
  version: 3
  flow: Classic

DESIGN_NAME: mesh_tile

VERILOG_FILES:
- dir::../../src/mesh_tile.v
- dir::../../src/mesh_router.v
- dir::../../src/subservient_core.v
- dir::../../src/serv/rtl/serv_aligner.v
- dir::../../src/serv/rtl/serv_alu.v
- dir::../../src/serv/rtl/serv_bufreg.v
- dir::../../src/serv/rtl/serv_bufreg2.v
- dir::../../src/serv/rtl/serv_compdec.v
- dir::../../src/serv/rtl/serv_csr.v
- dir::../../src/serv/rtl/serv_ctrl.v
- dir::../../src/serv/rtl/serv_debug.v
- dir::../../src/serv/rtl/serv_decode.v
- dir::../../src/serv/rtl/serv_immdec.v
- dir::../../src/serv/rtl/serv_mem_if.v
- dir::../../src/serv/rtl/serv_rf_if.v
- dir::../../src/serv/rtl/serv_rf_ram_if.v
- dir::../../src/serv/rtl/serv_rf_ram.v
- dir::../../src/serv/rtl/serv_rf_top.v
- dir::../../src/serv/rtl/serv_state.v
- dir::../../src/serv/rtl/serv_synth_wrapper.v
- dir::../../src/serv/rtl/serv_top.v
- dir::../../src/serv/servile/servile_arbiter.v
- dir::../../src/serv/servile/servile_mux.v
- dir::../../src/serv/servile/servile_rf_mem_if.v
- dir::../../src/serv/servile/servile.v
- dir::../../src/subservient/rtl/subservient_debug_switch.v
- dir::../../src/subservient/rtl/subservient_fpga.v
- dir::../../src/subservient/rtl/subservient_generic_ram.v
- dir::../../src/subservient/rtl/subservient_gpio.v
- dir::../../src/subservient/rtl/subservient_nexys_a7_clock_gen.v
- dir::../../src/subservient/rtl/subservient_ram.v
- dir::../../src/subservient/rtl/subservient_rf_ram_if.v
- dir::../../src/subservient/rtl/subservient.v

# Clock
CLOCK_PORT: clk
CLOCK_PERIOD: 40  # 25 MHz

# Power
VDD_NETS: [VDD]
GND_NETS: [VSS]

# Synthesis
SYNTH_STRATEGY: AREA 0
MAX_FANOUT_CONSTRAINT: 12

# SRAMs placed at the BOTTOM of the die so all standard cells are forced
# into the top strip (y=537..710). cut_rows removes every row overlapping
# the SRAM+halo zone (y=12..536), leaving ~45 full-width rows above at
# ~40% density — high enough that RePlAce keeps cells in that strip and
# never drifts into the SRAM Metal1 OBS. Fixes DPL-0010.
# sram_inst0: x=[10,311], y=[12,528]  OBS: x=[16,305], y=[18,522]
# sram_inst1: x=[360,661], y=[12,528] OBS: x=[366,655], y=[18,522]
FP_SIZING: absolute
DIE_AREA: [0, 0, 1200, 720]
CORE_AREA: [10, 10, 1190, 710]

# FP_OBSTRUCTIONS over SRAM Metal1 OBS bodies (placement blockages).
FP_OBSTRUCTIONS:
- [16, 18, 305, 522]
- [366, 18, 655, 522]

# Placement
PL_TARGET_DENSITY_PCT: 30
PL_WIRE_LENGTH_COEF: 0.1
PL_MAX_DISPLACEMENT_X: 1000
PL_MAX_DISPLACEMENT_Y: 400
GRT_ALLOW_CONGESTION: true
GRT_MACRO_EXTENSION: 6
DRT_ANTENNA_REPAIR_ITERS: 5

# Skip slow optimizations
RUN_POST_GPL_DESIGN_REPAIR: false
RUN_POST_CTS_RESIZER_TIMING: false
GRT_RESIZER_TIMING_OPTIMIZATIONS: false

# PDN
PDN_VWIDTH: 3
PDN_HWIDTH: 3
PDN_VPITCH: 50
PDN_HPITCH: 50
PDN_CORE_RING: false

ERROR_ON_MAGIC_DRC: false

# SRAMs side-by-side at the bottom of the die with a 50 um gap.
# sram_inst0 at site 0 (x=10.08), sram_inst1 at site 625 (x=360.08).
MACROS:
  gf180mcu_ocd_ip_sram__sram1024x8m8wm1:
    gds:
      - dir::../../ip/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.gds
    lef:
      - dir::../../ip/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.lef
    vh:
      - dir::../../ip/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.blackbox.v
    lib:
      "*_tt_025C*":
        - dir::../../ip/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__tt_025C_1v80.lib
      "*_ff_n40C*":
        - dir::../../ip/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__ff_n40C_1v98.lib
      "*_ss_125C*":
        - dir::../../ip/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__ss_125C_1v62.lib
    instances:
      sram_inst0:
        location: [10.08, 11.76]
        orientation: N
      sram_inst1:
        location: [360.08, 11.76]
        orientation: N

PDN_MACRO_CONNECTIONS:
- "sram_inst0 VDD VSS VDD VSS"
- "sram_inst1 VDD VSS VDD VSS"

# Horizontal halo 40um keeps stdcells well clear of SRAM sides.
# Vertical halo 8um causes cut_rows to remove the partial row that
# overlaps the SRAM Metal1 obstruction zone (which starts at macro y=6).
FP_MACRO_HORIZONTAL_HALO: 40
FP_MACRO_VERTICAL_HALO: 8
PDN_HORIZONTAL_HALO: 5
PDN_VERTICAL_HALO: 5
PDN_CFG: dir::pdn_cfg.tcl